services:
   app:
     build: .
     ports:
       - "8000:8000"
     environment:
       - SECRET_KEY=${SECRET_KEY}
       - ALGORITHM=${ALGORITHM}
       - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
       - DATABASE_URL=sqlite:///./test.db
     volumes:
       - ./test.db:/app/test.db